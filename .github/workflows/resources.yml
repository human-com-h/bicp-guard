name: Resource and recorded-run verification
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python scripts/check_resources.py --download
      - run: python scripts/audit_publication.py --history --asset-dir artifacts/cache
      - run: python scripts/evaluate_longitudinal.py --output outputs/evaluated
      - run: python scripts/reproduce_tables.py --longitudinal-source outputs/evaluated --output outputs/rebuilt
      - run: python -m unittest discover -s tests -v
